AWSTemplateFormatVersion: '2010-09-09'
Description: >
  GitHub Actions OIDC federation for CI deploys. Creates the GitHub OIDC identity
  provider (account-wide, created once) and a least-privilege IAM role that a
  specific repo+branch may assume to deploy a static site — write to one S3
  bucket and invalidate CloudFront. No long-lived credentials are stored in
  GitHub; Actions exchanges a short-lived OIDC token for this role.

Parameters:
  GitHubOrg:
    Type: String
    Description: GitHub org/user that owns the repo (e.g. jroberts64).
  GitHubRepo:
    Type: String
    Description: Repository name (e.g. bin-builder).
  GitHubRef:
    Type: String
    Default: refs/heads/main
    Description: Git ref allowed to assume the role (branch-scoped).
  SiteBucketName:
    Type: String
    Description: S3 bucket the role may write to.
  CreateOIDCProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: >
      Create the GitHub OIDC provider. Set 'false' for additional repos in the
      same account (the provider is account-wide and may exist only once).

Conditions:
  ShouldCreateOIDC: !Equals [!Ref CreateOIDCProvider, 'true']

Resources:
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOIDC
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # GitHub's OIDC is validated via the IAM-managed root CA; a thumbprint is
      # still required by the API. This is GitHub's documented value.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${GitHubRepo}-gha-deploy'
      Description: !Sub 'GitHub Actions deploy role for ${GitHubOrg}/${GitHubRepo}'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Scope to exactly this repo AND ref — nothing else can assume it.
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOrg}/${GitHubRepo}:ref:${GitHubRef}'
      Policies:
        - PolicyName: deploy-static-site
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Write the built site to the one bucket (and read for --delete diff).
              - Sid: S3SyncToSiteBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub 'arn:aws:s3:::${SiteBucketName}'
                  - !Sub 'arn:aws:s3:::${SiteBucketName}/*'
              # Invalidate the CDN cache. CreateInvalidation does not support
              # resource-level scoping, so this is account-wide for CloudFront
              # invalidations only (cannot read/modify distributions).
              - Sid: CloudFrontInvalidate
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: '*'
              # The deploy script reads stack outputs to find bucket/distribution.
              - Sid: ReadOwnStackOutputs
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${GitHubRepo}-site/*'

Outputs:
  DeployRoleArn:
    Description: Role ARN for the GitHub Actions workflow to assume.
    Value: !GetAtt DeployRole.Arn
